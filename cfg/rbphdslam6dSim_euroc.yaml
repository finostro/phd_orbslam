
config:
  euroc:
    folder: /media/hdd/finostro/euroc_dataset/V2_01_easy
    timestampsFilename: /media/hdd/finostro/euroc_dataset/EuRoC_TimeStamps/V201.txt
  use_ros_gui: true
  logging:
    logResultsToFile: true
    logTimingToFile: true
    logDirPrefix: data/rbphdslam6d
  timesteps: 3000
  sec_per_timestep: 0.033333
  trajectory:
    nSegments: 5
    vardx: 0.400
    vardy: 0.400
    vardz: 0.400
    vardqx: 0.0100
    vardqy: 0.0100
    vardqz: 0.0100
    vardqw: 0.0100
  landmarks:
    nLandmarks: 100
    varlmx: 0.0002
    varlmy: 0.0002
    varlmz: 0.0002
  measurements:
    rangeLimitMax: 20.0
    rangeLimitMin: 0.5
    rangeLimitBuffer: 0.0
    probDetection: 0.90
    clutterIntensity: 5e-10
    varzx: 1.0005
    varzy: 1.0005
    varzz: 1.0005
  filter:
    nParticles: 5000
    predict:
      processNoiseInflationFactor: 1.0
      birthGaussianWeight: 0.01
    update:
      measurementNoiseInflationFactor: 10.0
      KalmanFilter:
        innovationThreshold:
          range: 1.0
          bearing: 0.2
      GaussianCreateInnovMDThreshold: 30.0
    weighting:
      nEvalPt: 8
      minWeight: 0.5
      threshold: 3.0
      useClusterProcess: false
    resampling:
      effNParticle: 2500.0
      minTimesteps: 2
    merge:
      threshold: 3.0
      covInflationFactor: 1.5
    prune:
      threshold: 0.001
